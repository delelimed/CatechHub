name: Flutter Android Signed Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versione Release (es. 1.2.0) - Richiesta solo se su main'
        required: false
        type: string

  push:
    branches:
      - feature/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Scarica il codice sorgente
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Configura Java
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configura Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Scarica le dipendenze
      - name: Install dependencies
        run: flutter pub get

      # 5. Ricrea il file .env
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 6. Analisi del codice
      - name: Run Flutter Analyzer
        run: flutter analyze

      # 7. Decodifica il Keystore
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/keystore.jks

      # 8. Compila l'APK firmato
      # Passa --build-name solo se l'utente ha inserito una versione, altrimenti usa quella di pubspec.yaml
      - name: Build Signed Android APK
        env:
          SIGNING_KEYSTORE_PATH: /tmp/keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_CMD="flutter build apk --release --dart-define-from-file=.env --target-platform=android-arm64 --obfuscate --split-debug-info=./debug_info --strip"
          if [ -n "${{ inputs.version_name }}" ]; then
            BUILD_CMD="$BUILD_CMD --build-name=${{ inputs.version_name }}"
          fi
          $BUILD_CMD

      # 9. Salva l'APK negli Artifacts
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      # 10. Crea la Draft Release SOLO se avviato manualmente E su ramo 'main' E con versione inserita
      - name: Create GitHub Draft Release
        id: create_release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version_name != ''
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.version_name }}
          name: Release ${{ inputs.version_name }} (Draft)
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}